<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ALETIS">
  <rect width="64" height="64" rx="8" fill="#17251b"/>
  <!-- Símbolo bracket-A: quadrado outline + monograma A geométrico interno -->
  <rect x="10" y="10" width="44" height="44" rx="2" fill="none" stroke="#ede9d9" stroke-width="3"/>
  <!-- Triângulo interno do "A" -->
  <path d="M22 44 L32 18 L42 44 Z" fill="none" stroke="#ede9d9" stroke-width="3" stroke-linejoin="miter"/>
