<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Relatório BSC — {{CLIENTE_NOME}}</title>
<style>
  @page { size: A4; margin: 0; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #1a1a1a;
    font-size: 10.5pt;
    line-height: 1.5;
  }
  header.brand {
    background: linear-gradient(135deg, #0b2942 0%, #154a73 100%);
    color: #fff;
    padding: 22px 30px;
    border-bottom: 4px solid #2d6a4f;
    display: flex; justify-content: space-between; align-items: center;
  }
  header.brand h1 { margin: 0; font-size: 13pt; letter-spacing: 1px; }
  header.brand p  { margin: 2px 0 0; font-size: 9pt; opacity: 0.85; }
  .logo {
    width: 50px; height: 50px; border-radius: 50%;
    background: #2d6a4f; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 20pt;
  }
  .subheader {
    background: #f4f6f8;
    padding: 12px 30px;
    border-bottom: 1px solid #dfe4e8;
    font-size: 10pt;
  }
  .subheader strong { color: #0b2942; }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 24px 30px;
  }
  .card {
    border: 1px solid #cfd8dc;
    border-top: 5px solid #2d6a4f;
    border-radius: 6px;
    padding: 14px 16px;
    background: #fafdfb;
    page-break-inside: avoid;
  }
  .card h3 {
    color: #0b2942;
    margin: 0 0 8px;
    font-size: 12pt;
    border-bottom: 1px solid #2d6a4f;
    padding-bottom: 4px;
  }
  .card .resumo { font-size: 9.5pt; color: #333; margin: 0 0 10px; font-style: italic; }
  table.kpi {
    width: 100%;
    border-collapse: collapse;
    font-size: 9.5pt;
  }
  table.kpi th, table.kpi td {
    border-bottom: 1px dotted #cfd8dc;
    padding: 5px 6px;
    text-align: left;
  }
  table.kpi th { color: #0b2942; font-weight: bold; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 8.5pt;
    color: #fff;
    font-weight: bold;
  }
  .badge.verde     { background: #2d6a4f; }
  .badge.amarelo   { background: #d9a000; }
  .badge.vermelho  { background: #a12020; }

  .observacoes {
    padding: 10px 30px 20px;
    font-size: 10pt;
  }
  .observacoes h2 { color: #0b2942; font-size: 12pt; border-bottom: 2px solid #2d6a4f; padding-bottom: 4px; }

  footer.page-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 8px 30px;
    font-size: 8pt; color: #666;
    border-top: 1px solid #e0e0e0; background: #fff;
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
<header class="brand">
  <div style="display:flex;gap:16px;align-items:center;">
    <div class="logo">A</div>
    <div>
      <h1>ALETIS CONSULTORIA AGRO</h1>
      <p>Christian Kohler — Relatório Balanced Scorecard</p>
    </div>
  </div>
  <div style="text-align:right;font-size:9pt;">
    <div>Período: {{PERIODO}}</div>
    <div>{{DATA_EMISSAO}}</div>
  </div>
</header>

<div class="subheader">
  <strong>Cliente:</strong> {{CLIENTE_NOME}} &nbsp; | &nbsp;
  <strong>Consultor:</strong> {{CONSULTOR}}
</div>

<div class="cards">
  {{CARDS}}
</div>

<div class="observacoes">
  <h2>Observações do Consultor</h2>
  <p>{{OBSERVACOES}}</p>
</div>

<footer class="page-footer">
  <span>ALETIS Consultoria Agro — Christian Kohler</span>
  <span>{{DATA_EMISSAO}}</span>
</footer>
</body>
</html>
