# Interface compilada. O link current aponta para uma versão completa e validada.
# Mantém a porta usada pelo gateway público e pelo túnel existentes.
server {
    listen 5173;
    listen [::]:5173;
    server_name _;
    root /var/www/aletis-web/current;
    index index.html;

    # O servidor aceita até dez documentos de 25 MB por operação.
    client_max_body_size 260m;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Arquivos com hash são imutáveis. HTML e atualização do aplicativo sempre
    # consultam a versão publicada para não manter uma interface anterior.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
