# =============================================================
# ALETIS — docker-compose para desenvolvimento e migração
# =============================================================
# Sobe Postgres + API + Web + Site em uma rede compartilhada.
# `docker compose up -d` substitui o setup manual de cada serviço.
# Volumes nomeados preservam dados entre runs e migrações.
#
# Uso típico:
#   docker compose up -d                              # sobe tudo
#   docker compose logs -f api                        # acompanha API
#   docker compose exec api node dist/server.js       # shell na API
#   docker compose down                               # derruba sem
#                                                     # apagar volumes
#   docker compose down -v                            # apaga volumes
#                                                     # (cuidado!)
# =============================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: aletis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aletis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aletis_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-aletis}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aletis}']
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aletis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3011
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-aletis}:${POSTGRES_PASSWORD:-aletis_dev_only}@postgres:5432/${POSTGRES_DB:-aletis}
      ALETIS_PG_ENABLED: '1'
      ALETIS_AUTO_MIGRATE: '1'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET é obrigatório — gere com openssl rand -hex 32}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ALIX_HISTORY_WINDOW: ${ALIX_HISTORY_WINDOW:-30}
      ALIX_USE_LLM: ${ALIX_USE_LLM:-true}
      AZURE_AI_SERVICES_KEY: ${AZURE_AI_SERVICES_KEY:-}
      CLAUDE_FOUNDRY_BASE_URL: ${CLAUDE_FOUNDRY_BASE_URL:-https://aletisai2.services.ai.azure.com}
      ALIX_ORCHESTRATOR_MODEL: ${ALIX_ORCHESTRATOR_MODEL:-claude-sonnet-4-6}
      ALETIS_PORTAL_BASE_URL: ${ALETIS_PORTAL_BASE_URL:-http://localhost:5173}
      ALETIS_PORTAL_UPLOAD_DIR: /app/storage/portal-uploads
      LEAD_STORAGE_DIR: /app/storage/leads
      LEAD_WEBHOOK_URL: ${LEAD_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LEAD_EMAIL_TO: ${LEAD_EMAIL_TO:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-brazilsouth}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    env_file:
      - .env
    ports:
      - '${API_PORT:-3011}:3011'
    volumes:
      - api-storage:/app/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aletis-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-5173}:80'

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    container_name: aletis-site
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      LEAD_WEBHOOK_URL: ${LEAD_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LEAD_EMAIL_TO: ${LEAD_EMAIL_TO:-}
      LEAD_EMAIL_FROM: ${LEAD_EMAIL_FROM:-}
      LEAD_STORAGE_DIR: /app/storage/leads
    volumes:
      - site-storage:/app/storage
    ports:
      - '${SITE_PORT:-3000}:3000'

volumes:
  postgres-data:
    name: aletis-postgres-data
  api-storage:
    name: aletis-api-storage
  site-storage:
    name: aletis-site-storage
