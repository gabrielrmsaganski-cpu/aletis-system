# =============================================================
# ALETIS — docker-compose para desenvolvimento local
# =============================================================
# Sobe Postgres + API + Web em uma rede compartilhada.
# `docker compose up` substitui o setup manual de banco em
# cada estação. Volumes nomeados preservam dados entre runs.
# =============================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: aletis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aletis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aletis_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-aletis}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aletis}']
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aletis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3011
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-aletis}:${POSTGRES_PASSWORD:-aletis_dev_only}@postgres:5432/${POSTGRES_DB:-aletis}
      ALETIS_PG_ENABLED: '1'
      JWT_SECRET: ${JWT_SECRET:-aletis-portal-dev-secret-change-me-in-prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      ALIX_HISTORY_WINDOW: ${ALIX_HISTORY_WINDOW:-30}
      AZURE_AI_SERVICES_KEY: ${AZURE_AI_SERVICES_KEY:-}
      ALIX_ORCHESTRATOR_MODEL: ${ALIX_ORCHESTRATOR_MODEL:-claude-sonnet-4-6}
    env_file:
      - .env
    ports:
      - '${API_PORT:-3011}:3011'
    volumes:
      - api-storage:/app/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aletis-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-5173}:80'

volumes:
  postgres-data:
    name: aletis-postgres-data
  api-storage:
    name: aletis-api-storage
