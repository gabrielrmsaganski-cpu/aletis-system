# =============================================================
# ALETIS — docker-compose para desenvolvimento e migração
# =============================================================
# Sobe Postgres + API + Web + Site em uma rede compartilhada.
# `docker compose up -d` substitui o setup manual de cada serviço.
# Volumes nomeados preservam dados entre runs e migrações.
#
# Uso típico:
#   docker compose up -d                              # sobe tudo
#   docker compose logs -f api                        # acompanha API
#   docker compose exec api node dist/server.js       # shell na API
#   docker compose down                               # derruba sem
#                                                     # apagar volumes
#   docker compose down -v                            # apaga volumes
#                                                     # (cuidado!)
# =============================================================
services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: aletis-postgres-pgvector:16
    container_name: aletis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aletis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-aletis}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aletis}']
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aletis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3011
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-aletis}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}@postgres:5432/${POSTGRES_DB:-aletis}
      ALETIS_PG_ENABLED: '1'
      ALETIS_AUTO_MIGRATE: '1'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET é obrigatório — gere com openssl rand -hex 32}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ALIX_HISTORY_WINDOW: ${ALIX_HISTORY_WINDOW:-30}
      ALIX_USE_LLM: ${ALIX_USE_LLM:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALIX_ORCHESTRATOR_MODEL: ${ALIX_ORCHESTRATOR_MODEL:-gpt-5.6-terra}
      ALIX_DEAL_ANALYZER_MODEL: ${ALIX_DEAL_ANALYZER_MODEL:-gpt-5.6-sol}
      ALIX_DOC_EXTRACTOR_MODEL: ${ALIX_DOC_EXTRACTOR_MODEL:-gpt-5.6-luna}
      ALIX_DOC_CLASSIFIER_MODEL: ${ALIX_DOC_CLASSIFIER_MODEL:-gpt-5.6-luna}
      ALIX_SUMMARIZER_MODEL: ${ALIX_SUMMARIZER_MODEL:-gpt-5.6-luna}
      ALIX_MAX_TOOLS_PER_REQUEST: ${ALIX_MAX_TOOLS_PER_REQUEST:-24}
      ALETIS_PORTAL_BASE_URL: ${ALETIS_PORTAL_BASE_URL:-http://localhost:5173}
      ALETIS_PORTAL_UPLOAD_DIR: /app/storage/portal-uploads
      LEAD_STORAGE_DIR: /app/storage/leads
      LEAD_WEBHOOK_URL: ${LEAD_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LEAD_EMAIL_TO: ${LEAD_EMAIL_TO:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-evolution}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://host.docker.internal:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-aletis-principal}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      WHATSAPP_STORAGE_PROVIDER: ${WHATSAPP_STORAGE_PROVIDER:-local}
      WHATSAPP_STORAGE_DIR: /app/storage/whatsapp-media
      WHATSAPP_IA_ENABLED: ${WHATSAPP_IA_ENABLED:-true}
      WHATSAPP_IA_MODEL: ${WHATSAPP_IA_MODEL:-gpt-5.6-luna}
      WHATSAPP_AUDIO_REPLY_ENABLED: ${WHATSAPP_AUDIO_REPLY_ENABLED:-false}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-transcribe}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-tts-1-hd}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-nova}
      OPENAI_TTS_FORMAT: ${OPENAI_TTS_FORMAT:-opus}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CALENDAR_DRY_RUN: ${GOOGLE_CALENDAR_DRY_RUN:-true}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_TIMEZONE: ${GOOGLE_CALENDAR_TIMEZONE:-America/Cuiaba}
      GOOGLE_CALENDAR_CONSULTOR_NAME: ${GOOGLE_CALENDAR_CONSULTOR_NAME:-Christian}
      GOOGLE_CALENDAR_CONSULTOR_EMAIL: ${GOOGLE_CALENDAR_CONSULTOR_EMAIL:-}
      GOOGLE_OAUTH_ACCESS_TOKEN: ${GOOGLE_OAUTH_ACCESS_TOKEN:-}
      ALETIS_RBAC_STRICT: ${ALETIS_RBAC_STRICT:-false}
      ALETIS_CORE_DOCUMENT_DIR: /app/storage/core-documents
      ALETIS_DOCUMENT_AUTO_INDEX: ${ALETIS_DOCUMENT_AUTO_INDEX:-false}
      ALIX_CLIENT_INTELLIGENCE_MODEL: ${ALIX_CLIENT_INTELLIGENCE_MODEL:-gpt-5.6-terra}
      N8N_AUTOMATION_ENABLED: ${N8N_AUTOMATION_ENABLED:-false}
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      N8N_INBOUND_SECRET: ${N8N_INBOUND_SECRET:-}
      GOOGLE_WORKSPACE_ENABLED: ${GOOGLE_WORKSPACE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_OAUTH_FRONTEND_URL: ${GOOGLE_OAUTH_FRONTEND_URL:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_CALENDAR_CREATE_MEET: ${GOOGLE_CALENDAR_CREATE_MEET:-true}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    env_file:
      - .env
    ports:
      - '${API_PORT:-3011}:3011'
    volumes:
      - api-storage:/app/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aletis-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-5173}:80'

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    container_name: aletis-site
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      LEAD_WEBHOOK_URL: ${LEAD_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LEAD_EMAIL_TO: ${LEAD_EMAIL_TO:-}
      LEAD_EMAIL_FROM: ${LEAD_EMAIL_FROM:-}
      LEAD_STORAGE_DIR: /app/storage/leads
    volumes:
      - site-storage:/app/storage
    ports:
      - '${SITE_PORT:-3000}:3000'

volumes:
  postgres-data:
    name: aletis-postgres-data
  api-storage:
    name: aletis-api-storage
  site-storage:
    name: aletis-site-storage
